name: Deploy frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_INVESTMENT_COACH_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_INVESTMENT_COACH_PROJECT_ID }}
  VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}

jobs:
  deploy:
    name: Build and deploy Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.0

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment="${VERCEL_ENV}" --token="${{ secrets.VERCEL_INVESTMENT_COACH_TOKEN }}"

      - name: Build preview
        if: github.event_name != 'push'
        run: vercel build --token="${{ secrets.VERCEL_INVESTMENT_COACH_TOKEN }}"

      - name: Build production
        if: github.event_name == 'push'
        run: vercel build --prod --token="${{ secrets.VERCEL_INVESTMENT_COACH_TOKEN }}"

      - name: Deploy preview
        if: github.event_name != 'push'
        run: |
          url="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_INVESTMENT_COACH_TOKEN }}")"
          echo "Preview deployment: ${url}"

      - name: Deploy production
        if: github.event_name == 'push'
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_INVESTMENT_COACH_TOKEN }}")"
          echo "Production deployment: ${url}"
