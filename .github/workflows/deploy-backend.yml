name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  deploy:
    name: Build, test, and deploy API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/TenYearExplorer.sln

      - name: Build
        run: dotnet build backend/TenYearExplorer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/TenYearExplorer.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish backend/src/TenYearExplorer.Api/TenYearExplorer.Api.csproj --configuration Release --no-build --output "${{ runner.temp }}/api"

      - name: Verify fixture files
        shell: bash
        run: |
          test -f "${{ runner.temp }}/api/fixtures/apple-company-facts-reduced.json"
          test -f "${{ runner.temp }}/api/fixtures/apple-submissions-reduced.json"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INVESTMENT_COACH_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_INVESTMENT_COACH_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_INVESTMENT_COACH_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_INVESTMENT_COACH_WEBAPP_NAME }}
          package: ${{ runner.temp }}/api
